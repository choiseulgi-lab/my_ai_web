<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요 👋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .avatar {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2rem;
      color: #2d2d2d;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #764ba2;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    p {
      color: #666;
      line-height: 1.7;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-block;
      background: #f0ebff;
      color: #764ba2;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🙋</div>
    <h1>최슬기입니다</h1>
    <div class="subtitle">Claude Code로 바이브코딩 중</div>
    <p>안녕하세요! 이 페이지는 GitHub Pages로 배포된 첫 번째 랜딩 페이지입니다. AI와 함께 코딩하는 즐거움을 배우고 있습니다.</p>
    <span class="badge">🚀 Deployed with GitHub Actions</span>
  </div>
</body>
</html>
